name: Engine Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uie_test_db
          POSTGRES_USER: uie_test_user
          POSTGRES_PASSWORD: uie_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uie_test_user -d uie_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      UIE_DATABASE_URL: postgresql://uie_test_user:uie_test_password@localhost:5432/uie_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_postgres_live.py tests/test_async_reflexion_live.py
