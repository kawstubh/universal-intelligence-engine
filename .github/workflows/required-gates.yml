name: required-gates

on:
  pull_request:
    branches: [integration/uie-dental, feat/dental-production-stack-v1]
  push:
    branches: [integration/uie-dental]
  workflow_dispatch:
  workflow_run:
    workflows: ["Render Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  unit-and-safety:
    name: unit-and-safety
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
  type-and-lint:
    name: type-and-lint
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" ruff mypy
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/universal_intelligence_engine
  secret-scan:
    name: gitleaks
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  post-deploy-smoke:
    name: post-deploy-smoke
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Run live smoke checks (status codes only)
        env:
          LIVE_BASE_URL: ${{ vars.UIE_LIVE_BASE_URL }}
          SMOKE_CREDENTIAL: ${{ secrets.UIE_SMOKE_CREDENTIAL }}
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          base = os.environ.get("LIVE_BASE_URL", "").strip().rstrip("/")
          if not base:
              print("FAILED: UIE_LIVE_BASE_URL is empty or unset")
              sys.exit(2)
          def check(name, path, expected, method="GET", payload=None, token=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              code = 0
              for attempt in range(6):
                  req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=15) as response:
                          code = response.status
                  except urllib.error.HTTPError as exc:
                      code = exc.code
                  except (urllib.error.URLError, TimeoutError, OSError):
                      code = 0
                  if code == expected:
                      print(f"PASS: {name} HTTP {code}")
                      return True
                  if attempt < 5:
                      time.sleep(15)
              print(f"FAIL: {name} HTTP {code}")
              return False
          ok = True
          ok = check("health", "/health", 200) and ok
          ok = check("dental-health", "/v1/dental/health", 200) and ok
          ok = check("patient-ai-disabled", "/v1/dental/ai/patient/anything", 404) and ok
          ok = check("unauthenticated-doctor-ai", "/v1/dental/ai/doctor/anything", 401, "POST", {"prompt": "smoke"}) and ok
          credential = os.environ.get("SMOKE_CREDENTIAL", "").strip()
          if not credential:
              print("SKIPPED: no smoke credential")
          else:
              ok = check("authenticated-native-fallback", "/v1/intelligence/run", 200, "POST",
                         {"goal": "status", "context": {}, "constraints": {}}, credential) and ok
          sys.exit(0 if ok else 1)
          PY
