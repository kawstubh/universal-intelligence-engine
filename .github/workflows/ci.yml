name: CI

on:
  pull_request:
  push:
    branches: [main, feat/dental-production-stack-v1]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dental_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clamav:
        image: clamav/clamav-debian:1.5.4
        env:
          CLAMAV_NO_MILTERD: "true"
          CLAMAV_NO_FRESHCLAMD: "true"
          CLAMD_STARTUP_TIMEOUT: "300"
          CLAMD_CONF_StreamMaxLength: "15M"
        ports:
          - 3310:3310
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dental_test
      ORALYN_CLAMAV_INTEGRATION: "1"
      ORALYN_CLAMAV_HOST: 127.0.0.1
      ORALYN_CLAMAV_PORT: "3310"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
