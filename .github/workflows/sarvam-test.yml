name: Sarvam Provider Tests

on:
  pull_request:
    paths:
      - "src/universal_intelligence_engine/sarvam.py"
      - "src/universal_intelligence_engine/api.py"
      - "tests/test_sarvam_provider.py"
      - "tests/test_health_provider_reporting.py"
      - ".github/workflows/sarvam-test.yml"

jobs:
  sarvam-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_sarvam_provider.py tests/test_health_provider_reporting.py
