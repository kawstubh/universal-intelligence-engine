[project]
name = "universal-intelligence-engine"
version = "0.3.0"
description = "Domain-agnostic intelligence engine for research, reasoning, tools, agents, memory, and learning."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
